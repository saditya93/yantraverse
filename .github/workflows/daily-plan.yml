name: 📋 Daily Planning (9:00 AM IST)

on:
  schedule:
    - cron: '30 3 * * *'  # 9:00 AM IST / 3:30 AM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: 'Asia/Kolkata'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📋 Generate Daily Plan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run ai:plan
      
      - name: 💾 Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-plan
          path: DAILY_PLAN.json
          retention-days: 1
